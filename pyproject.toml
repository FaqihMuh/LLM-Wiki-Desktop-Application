[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki"
version = "1.0.0"
description = "LLM Wiki Operating System — desktop GUI for Persistent Memory ingest, query, and maintenance"
readme = "README_BUILD.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.11.1",
    "pymupdf4llm==1.27.2.3",
    "pymupdf==1.27.2.3",
    "rapidocr-onnxruntime==1.4.4",
    "certifi==2026.2.25",
]

[project.optional-dependencies]
# Only needed to build the distributable (see README_BUILD.md); not a
# runtime dependency of the application itself.
build = [
    "pyinstaller>=6.0",
]

[tool.setuptools.packages.find]
include = ["gui", "gui.*"]
